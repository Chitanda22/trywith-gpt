<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henry Chitanda - Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .hero {
      background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('prof.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 1.2rem;
    }

    .profile-photo {
      width: 250px;
      height: 250px;
      border-radius: 70%;
      object-fit: cover;
      border: 3px solid white;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <section class="hero">
    <img src="https://github.com/Chitanda22/trywith-gpt/blob/main/henry.jpg?raw=true" alt="Henry Chitanda profile photo" class="profile-photo">
    <h1>Henry Chitanda</h1>
    <p>Mechatronics and Material Engineer </p>
  </section>

</body>
</html>
